name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/2026

          mkdir -p _site/past_conferences

          for dir in 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025; do
            if [ -d "past_conferences/$dir" ]; then
              cp -R "past_conferences/$dir" _site/past_conferences/
              cp -R "past_conferences/$dir" _site/
            fi
          done

          for dir in images material; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done

          for file in main.css trophy.png google9dee4025050b0d2a.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          if [ -d assets/2026 ]; then
            mkdir -p _site/assets _site/2026
            cp -R assets/2026 _site/assets/2026
            cp -R assets/2026 _site/2026/assets
          fi

          if [ -f assets/2026/ICSC_flyers.zip ]; then
            cp assets/2026/ICSC_flyers.zip _site/2026/
          fi

      - name: Build generated pages
        run: |
          pnpm exec tailwindcss -i ./src/styles/site.css -o ./_site/site.css --minify
          SITE_OUTPUT_DIR=_site pnpm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
